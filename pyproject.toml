[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jax-esm"
version = "0.1.0"
description = "A JAX-based Earth System Model coupler for coupling atmospheric, land, and ocean components"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "JAX-ESM Developers", email = "dwatsonparris@ucsd.edu"},
]
keywords = ["earth-system-modeling", "climate", "jax", "coupling"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]

dependencies = [
    "jax>=0.4.0",
    "jaxlib>=0.4.0",
    "numpy>=1.21.0",
    "typing-extensions>=4.0.0",
    "dataclasses-json>=0.5.0",
    "jax_datetime",
    "jax_tqdm",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=3.0",
    "mypy>=0.900",
    "ruff",
]

[project.urls]
"Homepage" = "https://github.com/climate-analytics-lab/jax-esm"
"Bug Reports" = "https://github.com/climate-analytics-lab/jax-esm/issues"
"Source" = "https://github.com/climate-analytics-lab/jax-esm"

[tool.setuptools]
packages = ["jax_esm", "jax_esm.components", "jax_esm.coupling", "jax_esm.utils"]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
