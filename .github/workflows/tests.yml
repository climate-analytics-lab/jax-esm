name: Tests

on:
  push:
    branches: [ main, dev/** ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Get jax-gcm
      uses: actions/checkout@v4
      with:
        repository: climate-analytics-lab/jax-gcm
        token: ${{ secrets.TOKEN_TO_CLONE }}
        ref: "08b87fe028b33e6c7f9470a6810b2ca2e688be02"
        path: jax-gcm

    - name: Show Working directory
      run: ls

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        pip install netcdf4 xarray jax tree_math flax dinosaur

    - name: Run tests with pytest
      run: |
        export PYTHONPATH=./jax-gcm:$PYTHONPATH
        python3 scripts/generate_jcm_boundary_file.py
        pytest tests/ -v --tb=short --cov=jax_esm --cov-report=xml --cov-report=term --ignore=tests/ignore

    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.10'
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff mypy

    - name: Check import sorting with ruff
      run: |
        ruff check --output-format=github jax_esm/ tests/
        ruff format --check jax_esm/ tests/

    - name: Type check with mypy
      run: |
        mypy jax_esm/ --ignore-missing-imports || true
