name: Tests

on:
  push:
    branches: [ main, dev/** ]
  pull_request:
    branches: [ main ]

# The jax-gcm revision every required job builds against. JAX-ESM is developed
# against a source checkout of jax-gcm rather than a PyPI release, so `dev`
# would mean the same JAX-ESM commit passes today and fails tomorrow for a
# reason that is not in this repository. The supported revision is recorded in
# `jem/components/jcm/contract.py` as JCM_SUPPORTED_REV, and
# tests/unit/test_jcm_contract.py asserts that this value equals it -- change
# one and the test tells you to change the other. The `canary-jcm-dev` job
# below still tracks `dev`, so drift is visible without blocking a PR.
env:
  JCM_REV: 637bfee51b8737895c4974b62a602641c98ab32e

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Get jax-gcm
      # mypy needs the real dependencies: with flax and jcm absent every
      # `struct.dataclass` collapses to Any and the generated constructors
      # are reported as unexpected keyword arguments. The type check is only
      # meaningful at dependency parity with the test job.
      uses: actions/checkout@v4
      with:
        repository: climate-analytics-lab/jax-gcm
        # Pinned; see the JCM_REV comment at the top of this workflow.
        ref: ${{ env.JCM_REV }}
        path: jax-gcm

    - name: Install the package and linters
      # Ruff is pinned to the same version jax-gcm pins: an unpinned latest
      # drifts new rules onto a clean repository and turns an unrelated PR red.
      run: |
        python -m pip install --upgrade pip
        pip install -e ./jax-gcm
        pip install -e ".[dev]"

    - name: Lint with ruff
      # The whole repository, not just jem/: examples and tests are code too,
      # and lint-only-jem is how they drifted to 124 findings.
      run: ruff check --output-format=github .

    - name: Type check with mypy
      run: JAX_PLATFORMS=cpu mypy jem/ --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # ubuntu only, 3.11-3.12: macOS added ~15 min per run for a pure-Python
        # package with no platform-specific code, and 3.13 is ahead of what the
        # JAX/Veros stack is tested against. Revisit when a user needs either.
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Get jax-gcm
      uses: actions/checkout@v4
      with:
        repository: climate-analytics-lab/jax-gcm
        # `jcm>=2.1.0b0` is not on PyPI, so this checkout is the only thing
        # that satisfies it; pinned, see the JCM_REV comment at the top of
        # this workflow.
        ref: ${{ env.JCM_REV }}
        path: jax-gcm

    - name: Get jittable veros
      uses: actions/checkout@v4
      with:
        repository: meteorologytoday/veros-jittable
        ref: dev/naive-fix-AD-needs-physical-justification
        path: veros-jittable

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      # jax-gcm goes in FIRST: installing it editable registers `jcm 2.1.0b0`
      # with pip, so the `jcm>=2.1.0b0` requirement of jax-esm resolves against
      # the checkout instead of failing to find it on PyPI.
      run: |
        python -m pip install --upgrade pip
        pip install -e ./jax-gcm
        pip install -e ".[dev]"
        pip install -r veros-jittable/requirements.txt

    - name: Run unit tests with pytest
      # veros-jittable is a source checkout, not a pip install, so it still
      # needs PYTHONPATH; jax-gcm no longer does.
      run: |
        export PYTHONPATH=$(pwd)/veros-jittable:$PYTHONPATH
        pytest tests/unit -q -m "not slow" --cov=jem --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.11'
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  examples:
    # Notebooks and run.sh drivers execute whole coupled models, so they are
    # far too slow for every push; a pull request is the point at which it is
    # worth knowing whether the examples still run.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Get jax-gcm
      uses: actions/checkout@v4
      with:
        repository: climate-analytics-lab/jax-gcm
        # Pinned; see the JCM_REV comment at the top of this workflow.
        ref: ${{ env.JCM_REV }}
        path: jax-gcm

    - name: Get jittable veros
      uses: actions/checkout@v4
      with:
        repository: meteorologytoday/veros-jittable
        ref: dev/naive-fix-AD-needs-physical-justification
        path: veros-jittable

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ./jax-gcm
        pip install -e ".[dev,plot]"
        pip install -r veros-jittable/requirements.txt
        pip install jupyter ipykernel
        python -m ipykernel install --user --name python3 --display-name "Python 3"

    - name: Run example notebooks and run.sh drivers
      run: |
        export PYTHONPATH=$(pwd)/veros-jittable:$PYTHONPATH
        pytest tests/examples -q

  docs:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Get jax-gcm
      uses: actions/checkout@v4
      with:
        repository: climate-analytics-lab/jax-gcm
        # Pinned; see the JCM_REV comment at the top of this workflow.
        ref: ${{ env.JCM_REV }}
        path: jax-gcm

    - name: Get jittable veros
      uses: actions/checkout@v4
      with:
        repository: meteorologytoday/veros-jittable
        ref: dev/naive-fix-AD-needs-physical-justification
        path: veros-jittable

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Set up pandoc
      uses: r-lib/actions/setup-pandoc@v2

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ./jax-gcm
        pip install -e ".[dev,docs,plot]"
        pip install -r veros-jittable/requirements.txt
        pip install -r docs/requirements.txt
        pip install ipykernel
        python -m ipykernel install --user --name python3 --display-name "Python 3"

    - name: Build Sphinx docs
      run: |
        export PYTHONPATH=$(pwd)/veros-jittable:$PYTHONPATH
        docs/build_docs.sh -c

  canary-jcm-dev:
    # Non-blocking early warning. The required jobs above pin
    # `env.JCM_REV`, which keeps JAX-ESM's CI reproducible but also hides
    # jax-gcm's own movement until somebody bumps the pin -- by which point a
    # rename may be months old and tangled with several others. This job runs
    # the same lint and fast tests against jax-gcm `dev`, so drift shows up as
    # a failure on the very PR that happens to run next, while it is still one
    # change to react to. `continue-on-error: true`: jax-gcm `dev` breaking is
    # never a reason to block a JAX-ESM pull request. When it goes red, read
    # `jem/components/jcm/contract.py` -- `test_jcm_contract.py` names the
    # integration point that moved.
    continue-on-error: true
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Get jax-gcm dev
      uses: actions/checkout@v4
      with:
        repository: climate-analytics-lab/jax-gcm
        # Deliberately NOT env.JCM_REV: tracking the branch is this job's
        # whole purpose.
        ref: dev
        path: jax-gcm

    - name: Get jittable veros
      uses: actions/checkout@v4
      with:
        repository: meteorologytoday/veros-jittable
        ref: dev/naive-fix-AD-needs-physical-justification
        path: veros-jittable

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install dependencies
      # Same ordering as the test job: jax-gcm first so that `jcm>=2.1.0b0`
      # resolves against the checkout instead of failing to find it on PyPI.
      run: |
        python -m pip install --upgrade pip
        pip install -e ./jax-gcm
        pip install -e ".[dev]"
        pip install -r veros-jittable/requirements.txt

    - name: Lint with ruff
      run: ruff check --output-format=github .

    - name: Run unit tests with pytest
      run: |
        export PYTHONPATH=$(pwd)/veros-jittable:$PYTHONPATH
        pytest tests/unit -q -m "not slow"
