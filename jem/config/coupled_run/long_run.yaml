# A ~10-year integration in fixed 30-day chunks.
defaults:
  - default
  - _self_

# 3600 days = 120 whole chunks. `total_time` must be a whole multiple of
# `chunk`, and is a fixed duration -- "years" and "months" are calendar units,
# not a fixed number of seconds, so `jcm.date.parse_duration_days` refuses
# them; spell a run length in days or weeks instead. Override this with
# another multiple of 30 days ("2190 days", "300 days").
total_time: "3600 days"
# 30-day chunks: short enough that an unhealthy state is caught (and the run
# restarts) without losing much, long enough that the per-chunk output and
# recompilation cost stays negligible.
chunk: "30 days"
# One record per chunk instead of every coupling step: at this length the
# instantaneous stream is both huge and not what a climate is read from.
#
# These are 30-day-WINDOW means, NOT calendar monthly means: the window is the
# chunk, so its boundaries drift against the real Gregorian months (which are
# 28-31 days) and a bin spans parts of two of them. For true calendar months
# use the Python API with `run_chunked(..., accumulate=..., health_check=None)`,
# which bins every record by the Gregorian month its own interval midpoint
# falls in, whatever the chunking:
#
#   jem.accumulate.monthly_mean(coupler)
#       twelve bins -- every January of the run in one, a climatology;
#   jem.accumulate.monthly_mean(coupler, total_time="3600 days")
#       one bin per calendar month of the run (119 of them for this length,
#       the first and last partial), which is the non-drifting equivalent of
#       what `output_averages` gives here.
output_averages: true
# Nothing about checkpointing is set here: a run this long outlives a queue
# slot and must checkpoint, and `default.yaml` already does -- repeating the
# value would only be a second place for it to drift. `checkpoint_interval`
# stays null for the same reason it is null by default: the chunk here is
# already 30 days, which is as rarely as a ten-year run should be willing to
# lose work, so spacing the saves out further would only cost time in a requeue.
#
# HOW TO RESUME ONE. The default `checkpoint_path` is relative, so it lands in
# the run's own Hydra output directory, and every launch gets a new one. A
# requeued job therefore has to be told where the last one wrote, in one of
# two ways:
#
#   # continue in the earlier run's directory (its output files are there too)
#   python -m jem.main +configuration=earth-slab coupled_run=long_run \
#       coupled_run.output_dir=outputs/2026-09-16/11-04-02
#
#   # or keep the restart state somewhere of its own, the same every launch
#   python -m jem.main +configuration=earth-slab coupled_run=long_run \
#       coupled_run.checkpoint_path=/scratch/$USER/earth-slab/checkpoint
#
# The second is what a queue script should do: one fixed absolute path, so the
# resubmit command is the submit command. Either way the run logs which state
# it started from, so a resume that silently became a cold start is visible in
# the first lines of the log.
