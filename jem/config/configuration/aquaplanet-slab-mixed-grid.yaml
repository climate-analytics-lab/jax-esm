# @package _global_
#
# Aquaplanet with the slab components on their own, non-atmospheric grid: a
# displaced-pole ocean grid, with ESMF weights mapping fields between it and
# the atmosphere's T31 Gaussian grid.
#
#   python -m jem.main +configuration=aquaplanet-slab-mixed-grid
#
# This is `examples/01_basic/04_jcm_slabs_mixed_grid_aqua_planet.ipynb` as a
# config, and the configuration that proves the coupler does not require one
# shared grid.
#
# WHY each setting:
#  - the ocean and sea ice run on the packaged `DisplacedPoleGrid` SCRIP grid,
#    with every cell active: this is an aquaplanet, so the grid carries no
#    land mask and the SCRIP file's own `grid_imask` (all 1, which in the
#    SCRIP convention means "active") is what is used. Being curvilinear it
#    is exactly what a shared-grid assumption would break on.
#  - the grid is not a complete tiling of the sphere. Its displaced pole is
#    open: the cells cover 12.5611 sr of 4*pi = 12.5664 sr, and the gap lies
#    over Greenland (about 34-49 W, 68-77 N; on Earth the pole is put over
#    land for exactly this reason, here it has no land to hide it). What
#    remains imperfect is confined to 11 of the atmosphere's 4608 cells
#    around it: the packaged conservative atmosphere->ocean weights account
#    for only 0.9996 of the sphere, so 0.042% of the atmosphere's surface flux
#    (0.0053 sr of area) reaches no ocean cell, and the ocean->atmosphere
#    conservative map covers those 11 cells by 0.0004 to 0.98 instead of 1
#    (the ice fraction it carries is scaled down by that). The bilinear
#    ocean->atmosphere SST map does cover every atmosphere cell with weights
#    summing to 1, but for 9 of those 11 cells (the ones the gap falls
#    inside) it is the unweighted mean of the grid's whole top row of 120
#    cells, not a local value. Everywhere else both maps are exact.
#  - regrid=esmf with the four packaged weight files, of which the standard
#    coupling uses three (`a2o_conserve`, `o2a_conserve`, `o2a_bilinear`; no
#    row carries an atmosphere-to-ocean state, so `a2o_bilinear` is loaded and
#    never called). Fluxes and areal fractions use the conservative maps
#    (budgets have to be preserved across the interface); the SST the
#    atmosphere reads uses the bilinear one.
#  - terrain=aquaplanet and ocean=slab as in `aquaplanet-slab`: the grids are
#    the experiment here, not the physics.
#  - land=none: an aquaplanet has no land component.
#  - atmosphere.run.time_step = 12 min: stated rather than left to the `run`
#    group's default, because a named configuration must not move if
#    jax-gcm's default does (it is jax-gcm's `run/default.yaml`, whose own
#    comment calls it "the validated ECHAM L47/L95 production step"). What is
#    known about it for THIS case: it is the step this configuration integrates
#    at, and it is not the physics' own: a `jcm.model.Model(...)` built with
#    no `time_step` takes the physics' stable step capped at 30 min, which is
#    30 for SPEEDY T31L8 and what jax-gcm's `speedy-t31` configuration states
#    (the Veros configurations here do too). No comparison of the two steps on
#    this coupled case is recorded, so neither is "the" validated one.
defaults:
  - override /physics@atmosphere.physics: speedy
  - override /grid@atmosphere.grid: speedy_t31_l8
  - override /terrain@atmosphere.terrain: aquaplanet
  - override /ocean: slab
  - override /seaice: slab
  - override /land: none
  - override /regrid: esmf

atmosphere:
  run:
    time_step: 12    # minutes; see the comment above

# `grid_file` is NOT a constructor argument of the slab models: it is read (and
# removed) by `jem.runners` when it builds the `SlabGrid` the component is then
# handed, exactly as the notebook does with `SlabGrid.from_scrip(...)`. Without
# it a slab model is built on the atmosphere's grid. No `land_fraction_file`:
# the grid's own all-active mask is the aquaplanet.
ocean:
  grid_file: ${jem_data:DisplacedPoleGrid.SCRIP.nc}
seaice:
  grid_file: ${jem_data:DisplacedPoleGrid.SCRIP.nc}

regrid:
  a2o_conserve: ${jem_data:weight_algo-conserve_JCM_T31_to_DisplacedPoleGrid.nc}
  a2o_bilinear: ${jem_data:weight_algo-bilinear_JCM_T31_to_DisplacedPoleGrid.nc}
  o2a_conserve: ${jem_data:weight_algo-conserve_DisplacedPoleGrid_to_JCM_T31.nc}
  o2a_bilinear: ${jem_data:weight_algo-bilinear_DisplacedPoleGrid_to_JCM_T31.nc}
