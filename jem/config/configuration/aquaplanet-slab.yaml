# @package _global_
#
# Aquaplanet: SPEEDY T31L8 over a slab ocean with SST-diagnosed sea ice --
# the README's quick start, plus the ice the quick start leaves out.
#
#   python -m jem.main +configuration=aquaplanet-slab
#
# WHY each setting:
#  - the atmosphere is jax-gcm's `speedy-t31` configuration bundle, composed
#    whole under `atmosphere` and listed FIRST (Hydra refuses the other order,
#    since the overrides below act on the groups the bundle selects). That
#    brings SPEEDY on its native T31L8 grid (cheap enough for a laptop CPU,
#    which is what makes this the first thing a new user runs), its parameters
#    calibrated for coupled use, and the 30-minute step they were calibrated
#    at (`atmosphere.run.time_step`). None of those values is restated here:
#    they live once, in jax-gcm. The calibration was made with prescribed SSTs
#    against observations (docs/source/design/configuration.md), so a coupled
#    run is not guaranteed drift-free.
#  - terrain=aquaplanet and forcing=default, overriding the bundle's
#    `hf://` T63 orography and forcing files: zero orography and an all-ocean
#    mask, so the slab ocean covers the planet and no land component is
#    needed, and the SST the atmosphere sees comes from the coupled ocean, not
#    from a boundary file. Neither group reads a file, so the two `file` keys
#    the bundle leaves behind are set to null below (a composed config should
#    not name a download nothing performs); `terrain.interpolate` and
#    `forcing.align` are read only together with a file and so are inert.
#  - ocean=slab with no forcing term: the mixed layer responds to the coupled
#    surface heat flux alone. Nothing pins it, which is the point -- the
#    coupled system finds its own equilibrium.
#  - seaice=slab: the ice fraction the atmosphere's surface-flux scheme sees
#    is diagnosed from the coupled ocean's SST, so the ice cover follows the
#    ocean instead of staying at the forcing's ice-free default.
#  - land=none: there is no land.
defaults:
  - /configuration@atmosphere: speedy-t31
  - override /terrain@atmosphere.terrain: aquaplanet
  - override /forcing@atmosphere.forcing: default
  - override /ocean: slab
  - override /seaice: slab
  - override /land: none

atmosphere:
  terrain:
    file: null
  forcing:
    file: null
