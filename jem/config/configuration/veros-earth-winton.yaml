# @package _global_
#
# `veros-earth` with the Winton thermodynamic sea ice on the Veros ocean's grid.
#
#   python -m jem.main +configuration=veros-earth-winton
#
# WHAT THIS COUPLES: everything `veros-earth` couples (its comments apply), plus
# a sea ice that is the ocean's insulation and its source of heat and
# freshwater (docs/source/design/winton_seaice.md, "What the standard coupling
# does"; docs/source/design/exchange.md). The ice forms frazil from the
# freezing deficit a clamping Veros removes, passes the ocean the heat and
# freshwater it receives (in place of the atmosphere's sea-tile fluxes, so the
# swamp mask is not applied), and hands the atmosphere its fraction and skin
# temperature.
#
# WHAT A RUN SHOWS. The ocean starts from the observed annual-mean state (see
# veros-earth) with no ice on it, and the ice grows from there: in a 90-day
# run started on 1 January the ice covers 4% of the northern ocean after 30
# days and 6.5% after 60 and 90, averaging 0.9 m thick poleward of 65N (1.9 m
# at most), and the first southern ice appears in March. The sea surface
# holds at the -1.8 degC freezing point under it (without the ice it drifts
# to -3.5 degC), and the ice's energy budget closes to round-off. It is a
# cover growing from nothing over an annual-mean ocean, not an equilibrated
# seasonal cycle: that needs years of integration, which have not been run.
#
# WHY each setting (everything else is veros-earth's):
#  - seaice=winton: see above. The refusal in `jem.exchangers`/`VerosExchange`
#    for any other pairing (an SST-diagnosed ice over a clamping ocean, a
#    Winton ice over one that does not clamp) points back here.
#  - ocean.clamp_at_freezing: the ice forms frazil from the deficit the
#    ocean's clamp removes from the top cell; an ocean that kept its deficit
#    would have it frozen twice, and `VerosExchange.validate` refuses that.
#    (It is off by default: a clamp with no ice taking the deficit creates the
#    heat it removes it with.)
#  - seaice.grid_file / land_fraction_file: the ice lives on the OCEAN's grid,
#    not the atmosphere's (the group default), and its sea must be exactly
#    Veros' wet mask. The packaged land-fraction file is not that mask (it is
#    fractional, thresholded by the ocean setup), so the thresholded one,
#    generated by `jem.tools.veros_earth_ice_mask`, is named. The SCRIP file is
#    the ocean's own, by reference, so the two cannot drift.
#  - the ice is started ice-free (its `initial_ice_thickness` default of 0):
#    `ice_clim_file` would read the atmosphere's forcing file, which is on the
#    atmosphere's grid, not this one. The ocean starts at the freezing point
#    where the observed ocean is, so the ice forms there within days.
#    `+seaice.params.initial_ice_thickness=<metres>` covers EVERY ocean cell
#    at that thickness, which is a melting experiment, not an initial cover.
#  - coupling.exchanged_forcing adds `sice_am` and `sea_ice_temperature` to
#    veros-earth's `sea_surface_temperature`: the fields the ice's rows write
#    into the atmosphere. `VerosExchange` is a function, so they cannot be read
#    off a table and have to be declared, or `lax.scan` rejects the carry. The
#    runner warns that `sea_ice_temperature` is not time-varying in the
#    atmosphere's forcing: it is None there, and the atmosphere seeds it so the
#    declaration can hold a value the ice then overwrites each step.
defaults:
  - veros-earth
  - override /seaice: winton

ocean:
  clamp_at_freezing: true

seaice:
  grid_file: ${ocean.scrip_grid_file}
  land_fraction_file: ${jem_data:landsea_mask_binary_RotatedGaussianLatLon.nc}

coupling:
  exchanged_forcing: [sea_surface_temperature, sice_am, sea_ice_temperature]
