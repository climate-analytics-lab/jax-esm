# @package _global_
#
# The double-drake experiment: SPEEDY T31L8 over the Veros ocean GCM on an
# idealized two-continent planet.
#
#   python -m jem.main +configuration=veros-double-drake coupled_run=short_run
#
# WHAT THE OCEAN AND LAND ARE (an idealised planet, not Earth):
#  - Geometry: two meridional land dividers and a polar cap (the packaged
#    `terrain_double_drake_T31.nc`) carve the ocean into two basins. The
#    land-sea mask is the only geometry: every ocean column has the same flat
#    5200 m bottom (the sum of the 15 default layer thicknesses), and the
#    atmosphere's orography is zero.
#  - Grid: the ocean's cell centres ARE the atmosphere's (a uniform 3.75
#    degree longitude axis and the T31 Gaussian latitude axis), built from the
#    atmosphere's SCRIP grid, because the two are exchanged index-to-index
#    with no regridding: ocean cell (i, j) has to be at atmosphere cell
#    (i, j)'s position, or every flux is applied at the wrong latitude.
#  - Initial state: horizontally uniform -- SST 288.03 K everywhere, poles
#    included, salinity 35 -- with temperature falling linearly with depth to
#    zero at 4510 m (so the deepest layer starts at -1.15 degC).
#  - No sea ice: seaice=none. The only ice effect on the ocean is the swamp
#    mask in `jem.fluxes.mask_fluxes_under_ice`; the atmosphere sees no ice
#    cover at all.
#  - Land boundary conditions: one spatially uniform land, constant in time,
#    from `forcing_idealised_T31.nc` (below). SPEEDY's own slab land (inside
#    the atmosphere) warms and cools the continents with its heat budget from
#    that climatology: bare-land albedo 0.2, no snow, soil-water availability
#    0.65 and a 290 K skin temperature -- the rounded means of Earth's
#    ice-free land, and the same everywhere because this planet has no soils,
#    vegetation or snowfields to map. The land has no seasonal cycle of its
#    own boundary conditions, only the seasonal cycle of the sunlight it gets.
#
# WHY each setting:
#  - ocean=veros: the point of the experiment is a dynamical ocean; a slab
#    cannot transport heat between the two basins.
#  - ocean.setup names `jem.components.veros.setups.double_drake
#    .double_drake_setup`, an importable factory (`from_setup` calls it with
#    every other key in this node) rather than a script on PYTHONPATH. Every
#    physics default (`dt_mom`/`dt_tracer`, the layer thicknesses, the cold
#    start temperature) is a Python default on that factory, not repeated
#    here.
#  - ocean.atmosphere_grid_file is the SCRIP file of the atmosphere's grid
#    (`speedy_t31_l8`): the factory reads the ocean's shape and cell centres
#    from it. It must be the grid the atmosphere runs on; a different
#    resolution needs its own SCRIP file here and a matching terrain file.
#  - atmosphere.terrain.file and ocean.land_sea_mask_file are both
#    `terrain_double_drake_T31.nc`, packaged data generated by
#    `jem.tools.idealised_terrain` (its idealized two-continent geometry,
#    not real topography). A different geography or resolution is one call to
#    `jem.tools.idealised_terrain.idealised_terrain(reference_file,
#    planet_type, output_file)` plus `atmosphere.terrain.file=<path>
#    ocean.land_sea_mask_file=<path>` naming the result; the mask must have
#    the atmosphere grid's shape.
#  - atmosphere.forcing is `forcing@atmosphere.forcing=from_file` on the
#    packaged `forcing_idealised_T31.nc`, generated by
#    `jem.tools.idealised_terrain.idealised_forcing` (which holds the values
#    and says where they come from). Left at the default
#    `ForcingData.zeros` the bare-land albedo would be 0 and the land would
#    absorb all the sunlight it receives. Earth's climatology
#    (`veros-earth`'s file) is not an option: it describes Earth's
#    continents, and on this mask 442 of the 896 land cells are Earth ocean
#    cells, which it gives an ocean albedo and no soil water. A different
#    geography keeps this forcing (it is uniform) or calls
#    `idealised_forcing(terrain_file, output_file, ...)` for other values;
#    the file must be on the atmosphere's grid.
#  - atmosphere.forcing.align = wrap_year: the file's twelve records are a
#    climatology replayed every model year. `auto` resolves only jax-gcm's own
#    packaged products and raises for any other file, so the choice has to be
#    named; `by_date` would instead read the file's (arbitrary) 2001 dates and
#    refuse a run that starts in any other year.
#  - The file's `sst` is not used: the exchanger overwrites the atmosphere's
#    sea surface temperature from Veros every coupling step (see
#    `coupling.exchanged_forcing`). Its sea-ice concentration is zero, as no
#    sea ice is formed (seaice=none).
#  - atmosphere.run.time_step = 30 min: the value this configuration has been
#    run with, longer than the 12 min default; it is not otherwise tuned.
#  - seaice=none, land=none: neither is part of this experiment -- the
#    idealized continents carry no JAX-ESM land component (SPEEDY's own slab
#    land runs inside the atmosphere), and no sea ice is formed.
#  - coupling.exchanger names `jem.fluxes.VerosExchange`, which hands the
#    ocean the surface wind stress the atmosphere itself received (jax-gcm's
#    published, stability-corrected stress, so momentum is conserved across
#    the interface -- jax-esm#132), masks the heat and freshwater fluxes
#    wherever the surface has reached the freezing point, and carries the rest of
#    `jem.exchangers.VEROS_OCEAN_EXCHANGES` (the surface heat and freshwater
#    fluxes onto the ocean, its sea surface temperature back) -- so the ocean
#    is mechanically as well as thermodynamically forced. No `regrid` and no
#    `rotation_grid_file` are given: the ocean has the atmosphere's cell
#    centres and shape (above), and its axes are true east/north, so neither
#    regridding nor rotation is needed.
#  - coupling.exchanged_forcing = [sea_surface_temperature], the one
#    atmosphere forcing field `jem.fluxes.VerosExchange` writes when no land
#    or sea-ice component is composed (its ocean-facing fields are the
#    ocean's forcing, not the atmosphere's). It is declared by hand because
#    `VerosExchange` is a function, not an exchange table, so
#    `declare_exchanged_forcing` cannot read its writes off it. The
#    declaration is required, not decoration: the forcing file makes
#    `sea_surface_temperature` a `jcm.forcing.TimeSeries`, and an exchanger
#    overwriting it with a plain array would turn into a carry-structure
#    mismatch `lax.scan` refuses. The runner still logs a warning that the
#    exchanger is hand-written while `sice_am`, `snowc_am`, `soilw_am` and
#    `stl_am` stay time-varying: a generic reminder, and correct here because
#    this exchanger writes none of them with no land or sea-ice component.
#  - A Veros configuration also runs the atmosphere in double precision:
#    importing Veros sets `jax_enable_x64` process-wide, and which of the
#    atmosphere's own fields stay float32 depends on build order (whatever
#    jax-gcm allocated before Veros was imported); `VerosExchange` reads each
#    destination field's dtype at trace time rather than assuming one, so the
#    coupling itself is robust to that.
defaults:
  - override /physics@atmosphere.physics: speedy
  - override /grid@atmosphere.grid: speedy_t31_l8
  - override /terrain@atmosphere.terrain: from_file
  - override /forcing@atmosphere.forcing: from_file
  - override /ocean: veros
  - override /seaice: none
  - override /land: none

atmosphere:
  terrain:
    file: ${jem_data:terrain_double_drake_T31.nc}
  forcing:
    file: ${jem_data:forcing_idealised_T31.nc}
    align: wrap_year
  run:
    time_step: 30

ocean:
  setup: jem.components.veros.setups.double_drake.double_drake_setup
  atmosphere_grid_file: ${jem_data:JCM_T31.SCRIP.nc}
  land_sea_mask_file: ${jem_data:terrain_double_drake_T31.nc}

coupling:
  exchanger:
    _target_: jem.fluxes.VerosExchange
  exchanged_forcing: [sea_surface_temperature]
