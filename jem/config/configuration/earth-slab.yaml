# @package _global_
#
# Earth-like: realistic orography and a climatological surface, SPEEDY T31L8
# over a relaxed slab ocean, with SPEEDY's own slab land.
#
#   python -m jem.main +configuration=earth-slab
#
# This is `examples/02_experimental/01_earth.ipynb` as a config.
#
# WHY each setting:
#  - terrain/forcing come from jax-gcm's packaged T30 climatology rather than
#    the `hf://` mirror jax-gcm's own configurations use, so this runs with no
#    network. The T30 climatology is on the T31 grid's own 96x48 Gaussian
#    grid; `interpolate` stays at the group's default.
#  - ocean=slab_relax reading the same forcing file's `sst`: a free slab drifts
#    away from the observed state within months, so an Earth-like run relaxes.
#  - ocean relaxation_time = 30 days rather than the model's 60: this is the
#    validated setting of the notebook this configuration comes from -- at T31
#    the slower relaxation lets the tropical SST drift before the seasonal
#    cycle turns it around.
#  - no land component (land=none, the default): the land is the
#    atmosphere's own. SPEEDY runs its slab land (`land_model.f90`, jax-gcm's
#    `SpeedySurfaceFlux` default) on the same file's `stl` climatology, with
#    the file's `snowc` and `soilw_am`, forced by the flux over the land part
#    of each cell. The ocean takes the flux over the sea part, so the two
#    surfaces of a coast cell each take their own share. The anomaly relaxes
#    on jax-gcm's validated 40 days (SPEEDY's own; jax-gcm's
#    docs/source/design/speedy_retune.md); the 1 day this configuration used
#    with JAX-ESM's former land component was a stopgap for that component.
#    The relaxation is `SpeedySurfaceFlux`'s `land_params.tdland`, under
#    `atmosphere.physics.terms.speedy_surface_flux` like any jax-gcm term.
#  - seaice=slab on the same file's `icec`: the sea-ice cover the atmosphere
#    sees comes from this component, not from the forcing file -- the
#    exchange overwrites `atm.forcing.sice_am` with the slab's `ice_fraction`
#    before the atmosphere's first step. The slab diagnoses that fraction
#    from the ocean's SST, but the exchange runs before it has been handed
#    one, so whatever `initialize()` returns is what the atmosphere runs on
#    for its first coupling step. Starting the slab from the observed
#    concentration is what stops that being ice-free poles.
defaults:
  - override /physics@atmosphere.physics: speedy
  - override /grid@atmosphere.grid: speedy_t31_l8
  - override /terrain@atmosphere.terrain: from_file
  - override /forcing@atmosphere.forcing: from_file
  - override /ocean: slab_relax
  - override /seaice: slab

atmosphere:
  terrain:
    file: ${jcm_data:bc/t30/clim/terrain.nc}
  forcing:
    file: ${jcm_data:bc/t30/clim/forcing.nc}

ocean:
  sst_clim_file: ${jcm_data:bc/t30/clim/forcing.nc}
  params:
    relaxation_time: 2592000    # 30 days, in seconds

seaice:
  # The same file's `icec`, for the initial ice cover only; this component has
  # no relaxation and never reads it again.
  ice_clim_file: ${jcm_data:bc/t30/clim/forcing.nc}
