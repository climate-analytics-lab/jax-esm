# @package _global_
#
# Earth with a dynamical ocean and a sea ice: SPEEDY T31L8 over the Veros ocean
# GCM on a rotated Gaussian lon/lat grid, with the Winton thermodynamic sea ice
# on the ocean's grid, exchanging through ESMF weights.
#
#   python -m jem.main +configuration=veros-earth coupled_run=short_run
#
# WHAT THE OCEAN IS (an ocean on Earth's land-sea mask, bathymetry and
# observed mean state, with a thermodynamic sea ice, without realistic forcing
# history):
#  - Geometry: the land-sea mask decides which columns are ocean (the
#    packaged ERA5 land fraction on the ocean grid, thresholded at 0.5 into a
#    binary mask); the packaged ETOPO 2022 bathymetry decides how deep each
#    of them is, at this grid's resolution (about 3.75 degrees): a column
#    holds as many of the 15 default layers as fit above its depth, between
#    2 layers (120 m) and all 15 (5200 m).
#  - Initial state: the World Ocean Atlas 2018 annual-mean temperature and
#    salinity (NOAA NCEI), converted to the Conservative Temperature and
#    Absolute Salinity Veros' `temp` and `salt` are, averaged onto this
#    grid's cells and layers. SST therefore starts at about 29 degC in the
#    warm pool and at the freezing point (-1.4 degC on average south of 65S)
#    near the poles, and the deep ocean starts cold and salty, so a short run
#    shows the atmosphere's fluxes acting on an ocean with its observed
#    meridional and vertical structure, not spinning one up from nothing. It
#    is a climatological mean, not January's or any particular year's
#    state, and the currents start at rest, so the first days are a
#    geostrophic adjustment of the observed density field.
#  - Sea ice: the Winton ice (snow, two ice layers, an energy budget;
#    docs/source/design/winton_seaice.md, "What the standard coupling does";
#    docs/source/design/exchange.md) on the ocean's own grid. It is the
#    ocean's insulation and its source of heat and freshwater: it forms
#    frazil from the freezing deficit a clamping Veros removes, passes the
#    ocean the heat and freshwater it receives in place of the atmosphere's
#    sea-tile fluxes (so the swamp mask of `jem.fluxes.mask_fluxes_under_ice`
#    is not applied), and hands the atmosphere its fraction and its skin
#    temperature. It starts ice-free over the observed ocean, which is at the
#    freezing point where the ice should form, so the ice appears within days.
#    The ice cover the ATMOSPHERE sees is therefore the ice this ocean forms,
#    not the observed climatology in the forcing file (below).
#
# WHAT A RUN SHOWS: a 90-day run started on 1 January
# (`coupled_run.total_time="90 days"`) is finite throughout. The ice is a cover
# growing from nothing over an annual-mean ocean, not an equilibrated seasonal
# cycle (that needs years of integration, which have not been run): it covers
# 4.7 % of the northern ocean (by area) after 30 days, 7.7 % after 60 and 7.6 %
# after 90, with a mean thickness poleward of 65N of 0.6 m, 1.0 m and 1.2 m
# (2.6 m at most, on day 90); the first southern ice is on day 73 and covers
# 0.1 % of the southern ocean on day 90. The sea surface holds at the -1.8 degC
# freezing point under it (the run's minimum is -1.80 degC), and the ice's
# energy budget closes to 5e-12 W m-2 in every cell and record. The global-mean
# SST rises 0.9 K (17.8 to 18.7 degC). The atmosphere starts from isothermal
# rest and spends its first month settling: its net top-of-atmosphere flux
# is -78 W m-2 over the first ten days and +1 W m-2 over the last thirty, and
# the surface heat flux into the ocean falls from 72 W m-2 in the second ten
# days to 4 W m-2 in the last ten, so the budgets of a short run are the
# spin-up's, not an equilibrium's. The warmest land skin temperature is 313.6 K
# (40 degC), in eastern Australia on day 7.
#
# WHY each setting:
#  - atmosphere: jax-gcm's `speedy-t31` configuration bundle, composed first in
#    the defaults list so that this file's own choices below override its
#    terrain and forcing (Hydra refuses the other order). It carries SPEEDY
#    T31L8 with the parameters jax-gcm calibrated for coupled use -- the
#    top-of-atmosphere budget and the surface fluxes handed to an ocean -- at
#    the 30-minute time step it also sets (`atmosphere.run.time_step`). They
#    are fitted at T31 and 30 minutes against observations with prescribed
#    SSTs, so a coupled run is not guaranteed drift-free. The values live in
#    jax-gcm only (docs/source/design/speedy_retune.md there) and are not
#    restated here, so a retune reaches this configuration without an edit.
#  - ocean=veros on the packaged `RotatedGaussianLatLon` SCRIP grid: rotating
#    the grid moves its pole onto land, and the ocean's land-sea mask comes
#    from the matching packaged land-fraction file.
#  - ocean.setup names `jem.components.veros.setups.earth.earth_setup`, an
#    importable factory (`from_setup` calls it with every other key in this
#    node) rather than a script on PYTHONPATH; every physics default
#    (`dt_mom`/`dt_tracer`, the layer thicknesses, the cold start
#    temperature) is a Python default on that factory, not repeated here.
#  - regrid=esmf with the four packaged weight files for that grid pair --
#    conservative for fluxes, bilinear for states.
#  - atmosphere.terrain.file is the packaged `terrain_veros_earth_T31.nc`:
#    the ERA5-derived orography of `terrain_JCM_T31.nc` with a land fraction
#    derived from the OCEAN's wet mask (lsm = 1 - the wet mask conservatively
#    mapped onto the T31 grid, `jem.tools.veros_earth_terrain`). Two
#    independent coastlines disagree on about 4 % of the ocean area each way:
#    ocean columns would take sea fluxes over what the atmosphere counts as
#    land, atmosphere sea would send its flux to dry columns, and 110
#    coastal atmosphere cells would have no wet column near them and be
#    handed Veros' land fill value as their SST (jax-esm#162). With one
#    coastline, each atmosphere cell's sea area is exactly the wet area
#    under it, and `VerosExchange` raises if that ever fails to hold. It
#    stays on JCM's own **unrotated** grid: JCM computes its Coriolis
#    parameter from its own latitudes (no override hook), so the
#    atmosphere's terrain must be geographically consistent with *that*
#    latitude, not the ocean's rotated one. (The forcing file below still
#    describes the original coastline's land surface; the size of that is
#    given in docs/source/design/exchange.md.)
#  - atmosphere.terrain.interpolate stays at the bundle's `true`, which is
#    the right value although the file is already on the T31 grid: resampling
#    a field onto its own grid returns it (the mask exactly, the orography to
#    1e-4 m), and it is what brings the terrain to the model's float64 like
#    every other array of a Veros configuration; read as it is, a float32
#    terrain file would leave float32 leaves in the atmosphere's carry.
#  - atmosphere.forcing is jax-gcm's packaged T30 climatology, the same file
#    `+configuration=earth-slab` uses, because this is an Earth
#    configuration and the atmosphere needs Earth's land surface: bare-land
#    albedo, snow cover, soil water and the land skin-temperature
#    climatology SPEEDY's own slab land relaxes towards (that slab land runs
#    inside the atmosphere, so there is no land component: land=none).
#    Left at the default `ForcingData.zeros`, the land albedo would be 0
#    everywhere. The T30 climatology lives on the T31 grid's own 96x48
#    Gaussian grid. The bundle's `forcing.align: wrap_year` is the right
#    mode for it: it is a twelve-record climatology replayed every year,
#    which is what jax-gcm records for this packaged file. The file's `sst`
#    is NOT used: the exchanger overwrites the atmosphere's sea surface
#    temperature from Veros every coupling step (see
#    `coupling.exchanged_forcing`), and its observed ice cover is replaced
#    by the Winton ice's.
#  - seaice=winton: see above. The refusal in `jem.exchangers`/`VerosExchange`
#    for any other pairing (an SST-diagnosed ice over a clamping ocean, a
#    Winton ice over one that does not clamp) points back here.
#  - ocean.clamp_at_freezing: the ice forms frazil from the deficit the
#    ocean's clamp removes from the top cell; an ocean that kept its deficit
#    would have it frozen twice, and `VerosExchange.validate` refuses that.
#    (It is off by default: a clamp with no ice taking the deficit creates the
#    heat it removes it with.)
#  - seaice.grid_file / land_fraction_file: the ice lives on the OCEAN's grid,
#    not the atmosphere's (the group default), and its sea must be exactly
#    Veros' wet mask. The packaged land-fraction file is not that mask (it is
#    fractional, thresholded by the ocean setup), so the thresholded one,
#    generated by `jem.tools.veros_earth_ice_mask`, is named. The SCRIP file is
#    the ocean's own, by reference, so the two cannot drift.
#  - the ice is started ice-free (its `initial_ice_thickness` default of 0):
#    `ice_clim_file` would read the atmosphere's forcing file, which is on the
#    atmosphere's grid, not this one. `+seaice.params.initial_ice_thickness=
#    <metres>` covers EVERY ocean cell at that thickness, which is a melting
#    experiment, not an initial cover.
#  - land=none: the land is SPEEDY's own slab land inside the atmosphere.
#  - coupling.exchanger names `jem.fluxes.VerosExchange` with
#    `rotation_grid_file` set to the same SCRIP file `regrid` uses: it hands
#    the ocean the surface wind stress the atmosphere itself received
#    (jax-gcm's published, stability-corrected stress, so momentum is
#    conserved across the interface -- jax-esm#132), regridded
#    conservatively and rotated into the ocean grid's local frame using that
#    file's per-cell rotation angles, routes the heat and freshwater through
#    the sea ice, and carries the rest of
#    `jem.exchangers.VEROS_OCEAN_EXCHANGES` (regridded through the
#    weights above: conservatively for the fluxes, bilinearly for the sea
#    surface temperature) -- so the ocean is mechanically as well as
#    thermodynamically forced.
#  - coupling.exchanged_forcing = [sea_surface_temperature, sice_am,
#    sea_ice_temperature]: the atmosphere forcing fields `VerosExchange`
#    writes with a sea ice composed (its ocean-facing fields
#    `surface_taux`/`surface_tauy`/`heat_flux`/`freshwater_flux` are the
#    ocean's forcing, not the atmosphere's). They are declared by hand because
#    `VerosExchange` is a function, not an exchange table, so
#    `declare_exchanged_forcing` cannot read its writes off it. They are
#    required, not decoration: the forcing file makes
#    `sea_surface_temperature` and `sice_am` `jcm.forcing.TimeSeries`, and an
#    exchanger overwriting one with a plain array would change the carry's
#    pytree structure, which `lax.scan` refuses; `sea_ice_temperature` is None
#    in the file's forcing and the atmosphere seeds it, so the declaration can
#    hold a value the ice then overwrites each step. The runner logs two
#    warnings that follow from the hand declaration: that `sea_ice_temperature`
#    is not time-varying in the atmosphere's forcing, and that `snowc_am`,
#    `soilw_am` and `stl_am` stay time-varying. Both are generic reminders and
#    correct here: the exchanger writes none of those three with no land
#    component (it would write `soilw_am` with one, which would then have to
#    be declared too).
#  - A Veros configuration runs the whole model, atmosphere included, in
#    double precision, from the start: `ocean=veros` selects
#    `jax_enable_x64=true`, which the runner applies before building any
#    component (Veros itself runs float64 and flips JAX's process-global x64
#    mode when it is first imported, which would otherwise happen after the
#    atmosphere was built in float32 and leave it a mix of the two).
defaults:
  - /configuration@atmosphere: speedy-t31
  - override /terrain@atmosphere.terrain: from_file
  - override /forcing@atmosphere.forcing: from_file
  - override /ocean: veros
  - override /seaice: winton
  - override /land: none
  - override /regrid: esmf

atmosphere:
  terrain:
    file: ${jem_data:terrain_veros_earth_T31.nc}
  forcing:
    file: ${jcm_data:bc/t30/clim/forcing.nc}

ocean:
  clamp_at_freezing: true
  setup: jem.components.veros.setups.earth.earth_setup
  scrip_grid_file: ${jem_data:RotatedGaussianLatLon.SCRIP.nc}
  landsea_mask_file: ${jem_data:landsea_mask_fraction_RotatedGaussianLatLon.nc}
  # The ocean's bottom: the depth of each ocean column in metres, from NOAA
  # NCEI's ETOPO 2022 (CC0 public domain; its citation and terms are in the
  # file's attributes), averaged onto this grid by
  # `jem.tools.ocean_bathymetry` and clipped to [120 m, 5200 m] (the model's
  # two shallowest layers and its bottom). It only sets how deep a column is,
  # never whether it is ocean: that stays the land-sea mask's. The flat
  # alternative, every ocean column 5200 m deep, is selected from the command
  # line with `ocean.bathymetry_file=null`.
  bathymetry_file: ${jem_data:bathymetry_RotatedGaussianLatLon.nc}
  # The ocean's initial temperature and salinity: NOAA NCEI's World Ocean
  # Atlas 2018 annual means (public data, requested citation and terms in the
  # file's attributes), made by `jem.tools.ocean_initial_state`. It is annual
  # because WOA's monthly fields stop at 1500 m and a run can start in any
  # month. Without it every ocean column would start as the same 15 degC
  # profile with salinity 35 from the equator to the poles, so no water could
  # reach freezing in a short run and the polar oceans would heat the
  # atmosphere. The file holds values for exactly the wet cells of the
  # bathymetry above, so it is valid only with that bathymetry: changing
  # `ocean.bathymetry_file` needs a regenerated file (the setup refuses a
  # mismatch and says how). The uniform start of
  # `cold_start_temperature_celsius` is selected with
  # `ocean.initial_state_file=null`.
  initial_state_file: ${jem_data:ocean_initial_state_RotatedGaussianLatLon.nc}

regrid:
  a2o_conserve: ${jem_data:weight_algo-conserve_JCM_T31_to_RotatedGaussianLatLon.nc}
  a2o_bilinear: ${jem_data:weight_algo-bilinear_JCM_T31_to_RotatedGaussianLatLon.nc}
  o2a_conserve: ${jem_data:weight_algo-conserve_RotatedGaussianLatLon_to_JCM_T31.nc}
  o2a_bilinear: ${jem_data:weight_algo-bilinear_RotatedGaussianLatLon_to_JCM_T31.nc}

seaice:
  grid_file: ${ocean.scrip_grid_file}
  land_fraction_file: ${jem_data:landsea_mask_binary_RotatedGaussianLatLon.nc}

coupling:
  exchanger:
    _target_: jem.fluxes.VerosExchange
    rotation_grid_file: ${jem_data:RotatedGaussianLatLon.SCRIP.nc}
  exchanged_forcing: [sea_surface_temperature, sice_am, sea_ice_temperature]
