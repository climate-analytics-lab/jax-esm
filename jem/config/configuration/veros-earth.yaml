# @package _global_
#
# Earth with a dynamical ocean: SPEEDY T31L8 over the Veros ocean GCM on a
# rotated Gaussian lon/lat grid, exchanging through ESMF weights.
#
#   python -m jem.main +configuration=veros-earth coupled_run=short_run
#
# WHAT THE OCEAN IS (it is an idealised ocean on Earth's land-sea mask):
#  - Geometry: the land-sea mask decides which columns are ocean (the
#    packaged ERA5 land fraction on the ocean grid, thresholded at 0.5 into a
#    binary mask); the packaged ETOPO 2022 bathymetry decides how deep each
#    of them is, at this grid's resolution (about 3.75 degrees): a column
#    holds as many of the 15 default layers as fit above its depth, between
#    2 layers (120 m) and all 15 (5200 m).
#  - Initial state: horizontally uniform -- SST 288.03 K in every ocean
#    column, poles included, salinity 35 -- with temperature falling
#    linearly with depth to zero at 4510 m (so the deepest layer of a
#    full-depth column starts at -1.15 degC; every column has the same profile
#    over the layers it holds). A short run therefore shows the atmosphere's fluxes
#    spinning up an ocean that has no meridional structure, not an
#    equilibrated one.
#  - No sea ice: seaice=none, and a Winton sea ice cannot be composed with
#    Veros (jax-esm#160). The only ice effect on the ocean is the swamp mask
#    in `jem.fluxes.mask_fluxes_under_ice` (no cooling flux below the
#    freezing point). The ice cover the ATMOSPHERE sees is the observed
#    climatology in its forcing file (below), not something this ocean forms.
#
# WHY each setting:
#  - ocean=veros on the packaged `RotatedGaussianLatLon` SCRIP grid: rotating
#    the grid moves its pole onto land, and the ocean's land-sea mask comes
#    from the matching packaged land-fraction file.
#  - ocean.setup names `jem.components.veros.setups.earth.earth_setup`, an
#    importable factory (`from_setup` calls it with every other key in this
#    node) rather than a script on PYTHONPATH; every physics default
#    (`dt_mom`/`dt_tracer`, the layer thicknesses, the cold start
#    temperature) is a Python default on that factory, not repeated here.
#  - regrid=esmf with the four packaged weight files for that grid pair --
#    conservative for fluxes, bilinear for states.
#  - atmosphere.terrain.file is the packaged `terrain_veros_earth_T31.nc`:
#    the ERA5-derived orography of `terrain_JCM_T31.nc` with a land fraction
#    derived from the OCEAN's wet mask (lsm = 1 - the wet mask conservatively
#    mapped onto the T31 grid, `jem.tools.veros_earth_terrain`). Two
#    independent coastlines disagree on about 4 % of the ocean area each way:
#    ocean columns would take sea fluxes over what the atmosphere counts as
#    land, atmosphere sea would send its flux to dry columns, and 110
#    coastal atmosphere cells would have no wet column near them and be
#    handed Veros' land fill value as their SST (jax-esm#162). With one
#    coastline, each atmosphere cell's sea area is exactly the wet area
#    under it, and `VerosExchange` raises if that ever fails to hold. It
#    stays on JCM's own **unrotated** grid: JCM computes its Coriolis
#    parameter from its own latitudes (no override hook), so the
#    atmosphere's terrain must be geographically consistent with *that*
#    latitude, not the ocean's rotated one. (The forcing file below still
#    describes the original coastline's land surface; the size of that is
#    given in docs/source/design/exchange.md.)
#  - atmosphere.forcing is jax-gcm's packaged T30 climatology, the same file
#    `+configuration=earth-slab` uses, because this is an Earth
#    configuration and the atmosphere needs Earth's land surface: bare-land
#    albedo, snow cover, soil water and the land skin-temperature
#    climatology SPEEDY's own slab land relaxes towards (that slab land runs
#    inside the atmosphere, so there is no land component: land=none).
#    Left at the default `ForcingData.zeros`, the land albedo would be 0
#    everywhere. The T30 climatology lives on the T31 grid's own 96x48
#    Gaussian grid, and `forcing.align` needs no setting: jax-gcm resolves
#    `auto` for a packaged product from the kind its manifest records
#    (a climatology, replayed every year); any other file needs
#    `atmosphere.forcing.align` set explicitly. The file's `sst` is NOT used:
#    the exchanger overwrites the atmosphere's sea surface temperature from
#    Veros every coupling step (see `coupling.exchanged_forcing`).
#  - atmosphere.run.time_step = 30 min: the value this configuration has
#    been run with, longer than the 12 min default; it is not otherwise
#    tuned.
#  - seaice=none, land=none: this configuration couples the ocean only.
#  - coupling.exchanger names `jem.fluxes.VerosExchange` with
#    `rotation_grid_file` set to the same SCRIP file `regrid` uses: it hands
#    the ocean the surface wind stress the atmosphere itself received
#    (jax-gcm's published, stability-corrected stress, so momentum is
#    conserved across the interface -- jax-esm#132), regridded
#    conservatively and rotated into the ocean grid's local frame using that
#    file's per-cell rotation angles, masks the heat and freshwater fluxes
#    wherever the surface has reached the freezing point, and carries the
#    rest of `jem.exchangers.VEROS_OCEAN_EXCHANGES` (regridded through the
#    weights above: conservatively for the fluxes, bilinearly for the sea
#    surface temperature) -- so the ocean is mechanically as well as
#    thermodynamically forced.
#  - coupling.exchanged_forcing = [sea_surface_temperature]: the one
#    atmosphere forcing field `jem.fluxes.VerosExchange` writes when no land
#    or sea-ice component is composed (its ocean-facing fields
#    `surface_taux`/`surface_tauy`/`heat_flux`/`freshwater_flux` are the
#    ocean's forcing, not the atmosphere's). It is declared by hand because
#    `VerosExchange` is a function, not an exchange table, so
#    `declare_exchanged_forcing` cannot read its writes off it. It is
#    required, not decoration: the forcing file makes
#    `sea_surface_temperature` a `jcm.forcing.TimeSeries`, and an exchanger
#    overwriting it with a plain array would change the carry's pytree
#    structure, which `lax.scan` refuses. The runner still logs a warning
#    that the exchanger is hand-written while `sice_am`, `snowc_am`,
#    `soilw_am` and `stl_am` stay time-varying: that is a generic reminder,
#    and is correct here because this exchanger writes none of those four
#    with no land or sea-ice component (it would write `soilw_am` with a
#    land component, which would then have to be declared too).
#  - A Veros configuration runs the whole model, atmosphere included, in
#    double precision, from the start: `ocean=veros` selects
#    `jax_enable_x64=true`, which the runner applies before building any
#    component (Veros itself runs float64 and flips JAX's process-global x64
#    mode when it is first imported, which would otherwise happen after the
#    atmosphere was built in float32 and leave it a mix of the two).
defaults:
  - override /physics@atmosphere.physics: speedy
  - override /grid@atmosphere.grid: speedy_t31_l8
  - override /terrain@atmosphere.terrain: from_file
  - override /forcing@atmosphere.forcing: from_file
  - override /ocean: veros
  - override /seaice: none
  - override /land: none
  - override /regrid: esmf

atmosphere:
  terrain:
    file: ${jem_data:terrain_veros_earth_T31.nc}
  forcing:
    file: ${jcm_data:bc/t30/clim/forcing.nc}
  run:
    time_step: 30

ocean:
  setup: jem.components.veros.setups.earth.earth_setup
  scrip_grid_file: ${jem_data:RotatedGaussianLatLon.SCRIP.nc}
  landsea_mask_file: ${jem_data:landsea_mask_fraction_RotatedGaussianLatLon.nc}
  # The ocean's bottom: the depth of each ocean column in metres, from NOAA
  # NCEI's ETOPO 2022 (CC0 public domain; its citation and terms are in the
  # file's attributes), averaged onto this grid by
  # `jem.tools.ocean_bathymetry` and clipped to [120 m, 5200 m] (the model's
  # two shallowest layers and its bottom). It only sets how deep a column is,
  # never whether it is ocean: that stays the land-sea mask's. The flat
  # alternative, every ocean column 5200 m deep, is selected from the command
  # line with `ocean.bathymetry_file=null`.
  bathymetry_file: ${jem_data:bathymetry_RotatedGaussianLatLon.nc}

regrid:
  a2o_conserve: ${jem_data:weight_algo-conserve_JCM_T31_to_RotatedGaussianLatLon.nc}
  a2o_bilinear: ${jem_data:weight_algo-bilinear_JCM_T31_to_RotatedGaussianLatLon.nc}
  o2a_conserve: ${jem_data:weight_algo-conserve_RotatedGaussianLatLon_to_JCM_T31.nc}
  o2a_bilinear: ${jem_data:weight_algo-bilinear_RotatedGaussianLatLon_to_JCM_T31.nc}

coupling:
  exchanger:
    _target_: jem.fluxes.VerosExchange
    rotation_grid_file: ${jem_data:RotatedGaussianLatLon.SCRIP.nc}
  exchanged_forcing: [sea_surface_temperature]
